exp_id: rvt
tasks: all
bs: 6 #+3 pre gpu loaded, maxmum bs 24 for rvt2 config 8 gpus loaded
num_workers: 3
epochs: 5
sample_distribution_mode: task_uniform
peract:
  lr: 1.25e-5
  warmup_steps: 2000
  optimizer_type: lamb
  lr_cos_dec: True
  lambda_weight_l2: 1e-4
  amp: True
  bnb: True
  transform_augmentation_xyz: [0.125, 0.125, 0.125]
  transform_augmentation_rpy: [0.0, 0.0, 45.0]
rvt:
  place_with_mean: False
  img_aug: 0.0


depth: 1
stage_one_depth: 8
stage_two_depth: 1
attn_dim: 512

ds_rate: 1.0
adapter: ['late.layer.3.k.1.down.4.g.8']
model: "MVT_Resnet" 
output_dim: 512
stage_two: True
rot_ver: 1
feat_ver: 1
cvx_up: True

pretrain: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/pretrains/AdaptedR3M.pyth #backbone pretrain path, for reference.
overwriter_log_dir: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/runs/AdaptedR3M2RLBench_rvt2_bs6_lr1.25e-5 #log dir, and policy pth location for reference.
train_replay_storage_dir: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/train_data/replay_train #replay storage dir, for reference.
data_folder:   #data folder path if replay storage is not exist, for reference. for checking

num_train: 100

### python train.py --exp_cfg_path configs/adaptedR3M.yaml --device 0,1,2,3,4,5,6,7
### python train.py --exp_cfg_path configs/adaptedR3M.yaml --mvt_cfg_path mvt/configs/rvt2.yaml --device 0,1,2,3,4,5,6,7  #unadaptedR3M with rvt2 config, for reference

### LR quick note:
### train.py uses actual_lr = peract.lr * bs * num_gpus. Current bs=3.
### To match the stable single-GPU actual lr ~= 1.5e-4:
###     1 GPU:  peract.lr = 5e-5
###     2 GPUs: peract.lr = 2.5e-5
###     4 GPUs: peract.lr = 1.25e-5
### For full 5-epoch runs: set epochs: 5 and leave train_iterations unset.
