exp_id: rvt
tasks: "all"
bs: 4 #3 
num_workers: 2 # 4
epochs: 5
sample_distribution_mode: task_uniform
peract:
  lr: 5e-5 
  warmup_steps: 2000
  optimizer_type: lamb
  lr_cos_dec: True
  transform_augmentation_xyz: [0.125, 0.125, 0.125]
  transform_augmentation_rpy: [0.0, 0.0, 45.0]
rvt:
  place_with_mean: False


depth: 1
attn_dim: 512

ds_rate: 1.0 
adapter: []
model: "MVT_Resnet"
output_dim: 512

pretrain: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/pretrains/UnadaptedR3M.pt
overwriter_log_dir: /nesi/nobackup/uoa04758/xzha593/datasets/HRAlign/runs/UnadaptedR3M2RLBench_reproduced_second_try

