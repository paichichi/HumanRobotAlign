exp_id: rvt
tasks: all
bs: 3 
num_workers: 4
epochs: 15
sample_distribution_mode: task_uniform
peract:
  lr: 5e-5 
  warmup_steps: 2000
  optimizer_type: lamb
  lr_cos_dec: True
  lambda_weight_l2: 1e-4
  amp: True
  bnb: True
  transform_augmentation_xyz: [0.125, 0.125, 0.125]
  transform_augmentation_rpy: [0.0, 0.0, 45.0]
rvt:
  place_with_mean: False
  img_aug: 0.0


depth: 1
attn_dim: 512

ds_rate: 1.0
adapter: []
model: "MVT_Resnet"
output_dim: 512
stage_two: False
rot_ver: 1
feat_ver: 1
cvx_up: False

pretrain: /home/paichichi/data/pretrain/UnadaptedR3M.pt
overwriter_log_dir: /home/paichichi/data/HRAlign/runs/UnadaptedR3M2RLBench_rvt2
train_replay_storage_dir: /home/paichichi/data/rvt/train/replay/replay_train
num_train: 100

### python train.py --exp_cfg_path configs/unadaptedR3M.yaml --device 0,1,2,3,4,5,6,7
### python train.py --exp_cfg_path configs/rvt2.yaml --mvt_cfg_path mvt/configs/rvt2.yaml --device 0,1,2,3,4,5,6,7 #official rvt2 config, for reference
### python train.py --exp_cfg_path configs/unadaptedR3M.yaml --mvt_cfg_path mvt/configs/rvt2.yaml --device 0,1,2,3,4,5,6,7  #unadaptedR3M with rvt2 config, for reference
